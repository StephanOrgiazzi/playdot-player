name: Windows CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test frontend logic
        run: bun run test

      - name: Lint
        shell: pwsh
        run: |
          bun run lint 2>&1 | Tee-Object -FilePath lint.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check formatting
        shell: pwsh
        run: |
          bun run format 2>&1 | Tee-Object -FilePath format.log
          if ($LASTEXITCODE -ne 0) {
            bunx oxfmt -c ./.oxfmtrc.json .
            git diff --no-ext-diff --binary | Out-File -FilePath format.patch -Encoding utf8
            exit 1
          }

      - name: Build frontend
        run: bun run build

      - name: Prepare bundled libmpv runtime
        run: bun run setup-lib

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Compile Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: |
            lint.log
            format.log
            format.patch
