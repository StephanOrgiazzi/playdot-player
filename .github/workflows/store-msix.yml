name: Microsoft Store MSIX

on:
  pull_request:
    paths:
      - ".github/workflows/store-msix.yml"
      - "packaging/msix/**"
      - "scripts/**"
      - "src-tauri/**"
      - "src/**"
      - "shaders/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-store-msix:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install JavaScript dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build unsigned Store MSIX
        shell: pwsh
        run: ./scripts/build-msix.ps1

      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-Microsoft-Store-MSIX
          path: artifacts/msix/*.msix
          if-no-files-found: error
          retention-days: 30
