name: Microsoft Store MSIX

on:
  pull_request:
    paths:
      - ".github/workflows/store-msix.yml"
      - "packaging/msix/**"
      - "scripts/**"
      - "src-tauri/**"
      - "src/**"
      - "shaders/**"
      - "package.json"
      - "bun.lock"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/store-msix.yml"
      - "packaging/msix/**"
      - "scripts/**"
      - "src-tauri/**"
      - "src/**"
      - "shaders/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-store-msix:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install JavaScript dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build unsigned Store MSIX
        shell: pwsh
        run: ./scripts/build-msix.ps1

      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-Microsoft-Store-MSIX
          path: artifacts/msix/*.msix
          if-no-files-found: error
          retention-days: 30

      - name: Run Windows App Certification Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appCert = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\App Certification Kit\appcert.exe'
          if (-not (Test-Path -LiteralPath $appCert -PathType Leaf)) {
            throw "Windows App Certification Kit was not found at $appCert"
          }

          $package = Get-ChildItem -LiteralPath 'artifacts\msix' -Filter '*.msix' -File | Select-Object -First 1
          if (-not $package) {
            throw 'No MSIX package was found for WACK validation.'
          }

          $reportDirectory = Join-Path $PWD 'artifacts\wack'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
          $reportPath = Join-Path $reportDirectory 'PLAY-WACK-report.xml'

          & $appCert reset
          if ($LASTEXITCODE -ne 0) {
            throw "appcert reset failed with exit code $LASTEXITCODE."
          }

          & $appCert test -appxpackagepath $package.FullName -reportoutputpath $reportPath
          $appCertExitCode = $LASTEXITCODE

          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "WACK did not produce a report (appcert exit code $appCertExitCode)."
          }

          $report = Select-Xml -XPath '//REPORT' -Path $reportPath | Select-Object -First 1
          if (-not $report) {
            throw 'WACK report does not contain a REPORT element.'
          }

          $overallResult = [string]$report.Node.GetAttribute('OVERALL_RESULT')
          $tests = @(Select-Xml -XPath '//TEST' -Path $reportPath)
          $allFailedTests = @($tests | Where-Object { [string]$_.Node.Result.InnerText -eq 'FAIL' })
          $optionalFailedTests = @(
            $allFailedTests | Where-Object { [string]$_.Node.GetAttribute('OPTIONAL') -eq 'TRUE' }
          )
          $blockingFailedTests = @(
            $allFailedTests | Where-Object { [string]$_.Node.GetAttribute('OPTIONAL') -ne 'TRUE' }
          )

          Write-Host "WACK overall result: $overallResult"
          Write-Host "WACK tests: $($tests.Count), blocking failures: $($blockingFailedTests.Count), optional failures: $($optionalFailedTests.Count)"

          foreach ($optionalFailedTest in $optionalFailedTests) {
            Write-Host "::warning::WACK optional FAIL [$($optionalFailedTest.Node.GetAttribute('INDEX'))] $($optionalFailedTest.Node.GetAttribute('DESCRIPTION'))"
          }
          foreach ($blockingFailedTest in $blockingFailedTests) {
            Write-Host "::error::WACK FAIL [$($blockingFailedTest.Node.GetAttribute('INDEX'))] $($blockingFailedTest.Node.GetAttribute('DESCRIPTION'))"
          }

          if ($appCertExitCode -ne 0 -or $overallResult -ne 'PASS' -or $blockingFailedTests.Count -gt 0) {
            throw "Windows App Certification Kit failed. Report: $reportPath"
          }

      - name: Upload WACK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-WACK-report
          path: artifacts/wack/PLAY-WACK-report.xml
          if-no-files-found: warn
          retention-days: 30
