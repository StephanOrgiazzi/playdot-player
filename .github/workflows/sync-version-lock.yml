name: Sync release version lock

on:
  push:
    branches:
      - chore/version-1.16.0

permissions:
  contents: write

jobs:
  sync-cargo-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: chore/version-1.16.0

      - name: Sync PLAY. version in Cargo.lock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/Cargo.lock')
          content = path.read_text(encoding='utf-8')
          old = '[[package]]\nname = "playdot-player"\nversion = "0.16.0"\n'
          new = '[[package]]\nname = "playdot-player"\nversion = "1.16.0"\n'
          if content.count(old) != 1:
              raise SystemExit('Expected exactly one PLAY. 0.16.0 package entry in Cargo.lock')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore(release): sync Cargo.lock version"
          git push origin HEAD:chore/version-1.16.0
